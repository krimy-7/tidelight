<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tidelight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eef3ff; --ink-2:rgba(238,243,255,.74); --ink-3:rgba(238,243,255,.56);
  --line:rgba(238,243,255,.2); --accent:#ffa456;
  --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02040a;overflow:hidden;color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent);color:#fff}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:5px;border-radius:10px}

#menu{position:fixed;inset:0;display:grid;place-content:safe center;overflow-y:auto;overflow-x:hidden;justify-items:center;gap:clamp(28px,5.5vh,60px);padding:24px 16px;
  background:radial-gradient(130% 95% at 50% 42%,transparent 25%,rgba(1,2,8,.66) 100%);
  transition:opacity 1.4s var(--out),filter 1.4s var(--out),visibility 0s}
#menu.hidden{opacity:0;filter:blur(14px);visibility:hidden;pointer-events:none;transition:opacity 1.4s var(--out),filter 1.4s var(--out),visibility 0s 1.4s}
.title{text-align:center;animation:rise 2.2s var(--out) both}
.title h1{margin:0;font:300 italic clamp(60px,11vw,6rem)/.9 "Cormorant Garamond",serif;letter-spacing:-.01em;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.title p{margin:16px 0 0;color:var(--ink-2);font-size:15px;letter-spacing:.01em}
@keyframes rise{from{opacity:0;filter:blur(16px);transform:translateY(14px)}}
.themes{display:flex;gap:clamp(10px,2.6vw,32px);justify-content:center;animation:fade 1.6s .5s var(--out) both}
.start{display:grid;justify-items:center;gap:18px;animation:fade 1.6s .8s var(--out) both}
@keyframes fade{from{opacity:0}}
.theme{display:grid;justify-items:center;gap:10px;transition:transform .6s var(--out)}
.theme:hover{transform:translateY(-5px)}
.view{width:clamp(72px,14vw,156px);aspect-ratio:3/4;border-radius:999px 999px 16px 16px;position:relative;overflow:hidden;background:var(--g);
  outline:1px solid var(--line);outline-offset:-1px;box-shadow:0 18px 36px -18px rgba(0,0,0,.9);transition:box-shadow .6s var(--out),outline-color .6s}
.view::before{content:"";position:absolute;left:14%;right:14%;top:58%;height:2px;background:var(--sel);filter:blur(2px);opacity:.75}
.view::after{content:"";position:absolute;left:57%;top:20%;width:24%;aspect-ratio:1;background:radial-gradient(circle,var(--m) 26%,color-mix(in srgb,var(--m) 30%,transparent) 34%,transparent 70%)}
.theme[aria-pressed="true"] .view{outline:1.5px solid var(--sel);box-shadow:0 24px 40px -16px rgba(0,0,0,.95)}
.theme .name{font:400 23px/1 "Cormorant Garamond",serif}
.theme .desc{color:var(--ink-3);font-size:12px;line-height:1.4;max-width:17ch;text-align:center}
.theme[aria-pressed="true"] .desc{color:var(--ink-2)}
#ride{font:600 12px/1 Manrope;letter-spacing:.24em;text-transform:uppercase;padding:17px 38px;border-radius:999px;border:1px solid var(--line);
  background:rgba(238,243,255,.07);transition:background .5s,border-color .5s}
#ride:hover{background:rgba(238,243,255,.15);border-color:rgba(238,243,255,.45)}
.keys{display:flex;gap:8px 20px;flex-wrap:wrap;justify-content:center;color:var(--ink-3);font-size:12px}
kbd{font:600 11px/1 Manrope;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-right:3px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2)}

[hidden]{display:none!important}
/* round HUD buttons: sound top-right; pause and photo top-left while riding */
.hud-btn{position:fixed;top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);opacity:.5;transition:opacity .3s,background .3s}
.hud-btn:hover,#sound[aria-pressed="true"]{opacity:.95}
.hud-btn svg{width:20px;height:20px}
#sound{right:max(14px,env(safe-area-inset-right))}
#pause{left:max(14px,env(safe-area-inset-left))}
#shot{left:calc(max(14px,env(safe-area-inset-left)) + 54px)}
/* touch controls: steering under the left thumb, speed under the right, like the arrow keys */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pad>div{display:flex;gap:14px;pointer-events:auto;touch-action:none}
#pad .speed{flex-direction:column;margin-left:auto}
#pad button{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(4,6,12,.34);border:1px solid var(--line);
  transition:background .12s,border-color .12s,transform .25s var(--out)}
#pad button.on{background:rgba(238,243,255,.18);border-color:var(--accent);transform:scale(.93)}
#pad svg{width:26px;height:26px}
/* volume sliders */
.vol{-webkit-appearance:none;appearance:none;width:clamp(110px,24vw,150px);height:28px;margin:0;background:none;cursor:pointer;--p:70%}
.vol::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--p) 100% no-repeat,var(--line)}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .2s var(--out)}
.vol:active::-webkit-slider-thumb{transform:scale(1.2)}
.vol::-moz-range-track{height:2px;border-radius:2px;background:var(--line)}
.vol::-moz-range-progress{height:2px;border-radius:2px;background:var(--accent)}
.vol::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#hint{position:fixed;left:50%;bottom:20px;translate:-50% 0;color:var(--ink-3);font-size:12px;white-space:nowrap;transition:opacity 2s;pointer-events:none}
#hint.gone{opacity:0}
.options{display:flex;gap:16px 34px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--ink-3);animation:fade 1.6s .65s var(--out) both}
.opt{display:flex;align-items:center;gap:12px}
.opt-label{font:600 11px/1 Manrope;letter-spacing:.2em;text-transform:uppercase}
.swatches{display:flex;gap:9px}
.swatch{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 45%),var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 3px 8px rgba(0,0,0,.55);transition:transform .4s var(--out)}
.swatch:hover{transform:scale(1.12)}
.swatch[aria-pressed="true"]{outline:1.5px solid var(--ink);outline-offset:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button,.seg-solo{padding:7px 13px;font:600 11px/1 Manrope;letter-spacing:.06em;color:var(--ink-3);transition:background .3s,color .3s}
.seg-solo{border:1px solid var(--line);border-radius:999px}
.seg button[aria-pressed="true"],.seg-solo[aria-pressed="true"]{background:rgba(238,243,255,.14);color:var(--ink)}
#photoBar{position:fixed;left:50%;bottom:18px;translate:-50% 0;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 18px;border-radius:999px;background:rgba(4,6,12,.62);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap}
#photoBar button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font:600 11px/1 Manrope;letter-spacing:.04em}
#photoBar button:hover{background:rgba(238,243,255,.12)}
body.photo #sound,body.photo #hint,body.photo #caption{display:none}
#caption{position:fixed;left:50%;bottom:13vh;translate:-50% 0;margin:0;font:300 italic clamp(20px,2.6vw,30px)/1.2 "Cormorant Garamond",serif;color:var(--ink);text-shadow:0 2px 18px rgba(0,0,0,.7);white-space:nowrap;transition:opacity 1.6s var(--out),filter 1.6s var(--out);pointer-events:none}
#caption.gone,#dawn.gone{opacity:0;filter:blur(8px)}
#dawn{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;transition:opacity 3s var(--out),filter 3s var(--out);background:radial-gradient(60% 50% at 50% 50%,rgba(0,0,0,.25),transparent)}
#dawn h2{margin:0;font:300 italic clamp(64px,10vw,6rem)/1 "Cormorant Garamond",serif;text-shadow:0 4px 40px rgba(0,0,0,.4)}
#dawn p{margin:14px 0 0;color:var(--ink-2);font-size:15px}
@media (max-width:560px){.theme .desc{display:none}.theme .name{font-size:18px}.keys{gap:6px 14px}
  .options{flex-direction:column;align-items:stretch;gap:12px;width:min(100%,330px)}
  .opt{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:12px}
  .opt .vol{width:100%}
  .opt .seg-solo{justify-self:start}
  .swatches{gap:8px}}
.keys.touch{margin:0;max-width:34ch;text-align:center;line-height:1.5}
/* touch screens: these override the base rules above, so they come last */
@media (pointer:coarse){
  .hud-btn{background:rgba(4,6,12,.34);border:1px solid var(--line);opacity:.75}   /* phones: visible over bright water */
  .hud-btn:active,#sound[aria-pressed="true"]{opacity:1;background:rgba(4,6,12,.5)}
  .swatches{gap:12px}
  .swatch{width:34px;height:34px;position:relative}
  .swatch::after{content:"";position:absolute;inset:-6px}                 /* 46px tap area */
  .seg button,.seg-solo{min-height:44px;padding:0 16px;font-size:12px}
  .vol{height:44px}
  .vol::-webkit-slider-thumb{width:22px;height:22px;margin-top:-10px}
  .vol::-moz-range-thumb{width:22px;height:22px}
  .keys.kb{display:none}
  #hint{bottom:196px}
  #caption{bottom:max(13vh,210px)}
}
@media (pointer:fine){.keys.touch{display:none}}
</style>

<body>
<div id="menu" role="dialog" aria-label="Tidelight">
  <div class="title"><h1>Tidelight</h1><p>An endless night ride between two seas</p></div>
  <div class="themes" role="group" aria-label="Choose a theme">
    <button class="theme" data-mood="moon" aria-pressed="false" style="--g:linear-gradient(180deg,#030713 0%,#0b1930 46%,#24496f 57.5%,#07162b 58.5%,#030a14 100%);--m:#eef3ff;--sel:#ffa456">
      <span class="view"></span><span class="name">Moonlit</span><span class="desc">Silver tide, amber lanterns</span></button>
    <button class="theme" data-mood="dream" aria-pressed="false" style="--g:linear-gradient(180deg,#0a0420 0%,#2a0c3e 44%,#c0386e 57.5%,#1a0730 58.5%,#08031a 100%);--m:#ffd6ea;--sel:#ff5ec8">
      <span class="view"></span><span class="name">Dusk dream</span><span class="desc">Rose afterglow, violet water</span></button>
    <button class="theme" data-mood="glow" aria-pressed="false" style="--g:linear-gradient(180deg,#00050a 0%,#06302c 30%,#03202a 46%,#0d6f73 57.5%,#012026 58.5%,#00090d 100%);--m:#e6fff8;--sel:#3ff3ff">
      <span class="view"></span><span class="name">Bioluminescent</span><span class="desc">Glowing surf beneath the aurora</span></button>
  </div>
  <div class="options">
    <div class="opt" role="group" aria-label="Paint"><span class="opt-label">Paint</span><span class="swatches">
      <button class="swatch" data-paint="rosso" aria-label="Rosso red" style="--c:#8e0c16"></button>
      <button class="swatch" data-paint="pearl" aria-label="Pearl white" style="--c:#d8dce1"></button>
      <button class="swatch" data-paint="midnight" aria-label="Midnight blue" style="--c:#1b2f6b"></button>
      <button class="swatch" data-paint="graphite" aria-label="Matte graphite" style="--c:#2a2d33"></button>
      <button class="swatch" data-paint="verde" aria-label="Racing green" style="--c:#0f4a33"></button>
      <button class="swatch" data-paint="arancio" aria-label="Sunset orange" style="--c:#c2500f"></button>
    </span></div>
    <div class="opt" role="group" aria-label="Graphics"><span class="opt-label">Graphics</span><span class="seg">
      <button data-q="low">Low</button><button data-q="med">Medium</button><button data-q="high">High</button>
    </span></div>
    <div class="opt"><label class="opt-label" for="vol-music">Music</label><input class="vol" id="vol-music" type="range" min="0" max="100" data-vol="music"></div>
    <div class="opt"><label class="opt-label" for="vol-sfx">Sound</label><input class="vol" id="vol-sfx" type="range" min="0" max="100" data-vol="sfx"></div>
    <div class="opt" id="tiltRow"><span class="opt-label">Steering</span><button id="tilt" class="seg-solo" aria-pressed="false">Tilt to steer</button></div>
  </div>
  <div class="start">
    <button id="ride">Start riding</button>
    <div class="keys kb"><span><kbd>↑</kbd><kbd>↓</kbd>speed</span><span><kbd>←</kbd><kbd>→</kbd>steer</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>theme</span><span><kbd>P</kbd>photo</span><span><kbd>M</kbd>sound</span><span><kbd>Esc</kbd>menu</span></div>
    <p class="keys touch">Left buttons steer, right buttons set your speed. Pause brings you back here.</p>
  </div>
</div>
<button id="sound" class="hud-btn" aria-pressed="false" aria-label="Turn sound on"></button>
<button id="pause" class="hud-btn" aria-label="Pause and open the menu" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
<button id="shot" class="hud-btn" aria-label="Photo mode" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z"/><circle cx="12" cy="13.2" r="3.3"/></svg></button>
<div id="pad" hidden>
  <div class="steer"><button data-key="ArrowLeft" aria-label="Steer left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></button><button data-key="ArrowRight" aria-label="Steer right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button></div>
  <div class="speed"><button data-key="ArrowUp" aria-label="Speed up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14.5 6-6 6 6"/></svg></button><button data-key="ArrowDown" aria-label="Slow down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg></button></div>
</div>
<p id="caption" class="gone" aria-live="polite"></p>
<div id="photoBar" hidden><span>Drag to look around · Scroll to zoom</span><button id="photoSave">Save photo</button><button id="photoExit">Done</button></div>
<div id="dawn" class="gone" aria-live="polite"><h2>Dawn</h2><p></p></div>
<div id="hint" class="gone">↑ ↓ speed &nbsp;·&nbsp; ← → steer &nbsp;·&nbsp; Esc menu</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================= themes =================
const MOODS = {
  moon:  { mode:'MOONLIT', skyTop:0x02050e, skyHor:0x0e1d38, horGlow:0x1a3658, moon:0xeef3ff, moonSize:.035, phase:.25, milky:0x9fb6ff, milkyAmt:1,   accent:0x8fd0ff, water:0x02101e, foam:0xd6e6ff, bio:0, aurora:0, lamp:0xffa456, head:0xfff1df, mote:0xffd59a, jelly:0x7fd3ff, skyLant:0xffa24d, exposure:1 },
  dream: { mode:'DUSK DREAM', skyTop:0x070318, skyHor:0x240a36, horGlow:0xa82a5e, moon:0xffd6ea, moonSize:.045, phase:0,   milky:0xd29bff, milkyAmt:1.1, accent:0xff4fd8, water:0x07031c, foam:0xffd2f2, bio:0, aurora:0, lamp:0xff5ec8, head:0xffe8f6, mote:0xffb8ef, jelly:0xc88bff, skyLant:0xff9a7a, exposure:1.05 },
  glow:  { mode:'BIOLUMINESCENT', skyTop:0x000306, skyHor:0x02101a, horGlow:0x052a38, moon:0xe6fff8, moonSize:.03,  phase:2.1, milky:0x8fffe2, milkyAmt:1,   accent:0x3ff3ff, water:0x00080d, foam:0x2ef2ff, bio:1, aurora:1, lamp:0x3ff3ff, head:0xe6fbff, mote:0x9dfff0, jelly:0x3ff3ff, skyLant:0xffc977, exposure:1.25 },
};
const q = new URLSearchParams(location.search);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem('tidelight-' + k) : localStorage.setItem('tidelight-' + k, v); } catch { return null; } };
const STILL = q.has('still');
const MOBILE = matchMedia('(pointer: coarse)').matches;          // fixed 1920x1080 canvas for captures, skips the menu

// ================= road + terrain (JS twin of the GLSL below: keep both in sync) =================
const ROAD_Y = .32;
const roadX  = z => 26*Math.sin(z*.016) + 7*Math.sin(z*.037 + 1) + 14*Math.sin(z*.0061 + 2);
const roadDX = z => .416*Math.cos(z*.016) + .259*Math.cos(z*.037 + 1) + .0854*Math.cos(z*.0061 + 2);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const sstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
const fract = x => x - Math.floor(x);
// integer hash: bit-identical in JS and GLSL, and precise far from the origin
const hi = (x, y) => {
  let h = Math.imul(x, 1597334677) ^ Math.imul(y, 3812015801 | 0);
  h ^= h >>> 16; h = Math.imul(h, 2246822519 | 0); h ^= h >>> 13; h = Math.imul(h, 3266489917 | 0); h ^= h >>> 16;
  return (h >>> 0)*2.3283064e-10;
};
const n2 = (x, y) => {
  const fx = Math.floor(x), fy = Math.floor(y); let u = x - fx, v = y - fy; u = u*u*(3 - 2*u); v = v*v*(3 - 2*v);
  const a = hi(fx, fy), b = hi(fx + 1, fy), c = hi(fx, fy + 1), d = hi(fx + 1, fy + 1);
  return a + (b - a)*u + (c - a)*v + (a - b - c + d)*u*v;
};
const washZ = zc => sstep(.45, .7, n2(zc*.011, 7.5));
const floodZ = zc => sstep(.6, .78, n2(zc*.0045, 21.5));           // long stretches where the sea covers the road
const sandH = (u, x, z, zc) => {
  const a = Math.abs(u), ws = washZ(zc), fl = floodZ(zc);
  const base = a <= 2.6 ? 0 : a <= 3.6 ? (.06 + .1*n2(zc*.4, a))*Math.sin((a - 2.6)*Math.PI)*(1 - .8*ws) : -(a - 3.6)*.14;
  const bump = (n2(x*.17, z*.17) - .5)*.18 + (n2(x*.7 + 9, z*.7) - .5)*.08 + (n2(x*2.4, z*2.4 + 5) - .5)*.03;
  const w = Math.abs(u + .12*Math.sin(zc*.07) + .06*Math.sin(zc*.23));
  const g = (c, wd) => Math.exp(-(((w - c)/wd)**2));
  const rut = a < 2.4 ? -.05*g(.6, .11) - .04*g(1.45, .13) + .014*(g(.38, .07) + g(.82, .07) + g(1.2, .08) + g(1.72, .08)) : 0;
  return ROAD_Y + base + bump*(1 - .6*sstep(5, 7, a)) + rut*(1 - ws) - (.16*ws + .1*fl)*(1 - clamp((a - 3.6)/2.4, 0, 1));
};
const surge = (zc, t) => { const ph = fract(t*.085 + n2(zc*.015, 3)*1.6); return ph < .18 ? sstep(0, .18, ph) : 1 - sstep(.18, 1, ph); };
const entrySide = zc => clamp(Math.sin(zc*.0037 + .5)*4, -1, 1);
const waterLevel = (u, zc, t) => {
  const ws = washZ(zc), fl = floodZ(zc), sg = surge(zc, t), e = u*entrySide(zc);
  const surgeLvl = ROAD_Y - .45 + ws*(.05 + .33*sg - .009*(e + 3.6));          // waves washing over the low spots
  const floodLvl = ROAD_Y - .45 + fl*(.43 + .07*sg - .006*e);                  // sea standing on the road, swells rolling across
  const table = ROAD_Y - .11 + .03*n2(zc*.03, 4) - .16*ws - .1*fl;              // water table: every hollow and rut holds water
  return Math.max(surgeLvl, floodLvl, table);

const roadPt = (zc, u) => { const dx = roadDX(zc), k = 1/Math.hypot(1, dx); return [roadX(zc) + u*k, zc - dx*k*u]; };

const COMMON = /* glsl */`
uniform float uTime, uMoonSize, uPhase, uMilkyAmt, uAurora, uBio, uShootP, uSun, uDawn, uLite;
uniform vec3 uMoonDir, uMilkyN, uGalC, uSkyTop, uSkyHor, uHorGlow, uMoonCol, uMilky, uWater, uFoam, uHeadCol, uHeadPos, uHeadDir, uShootA, uShootB, uSunDir;
#define ROAD_Y .32
float gs(float x){ return exp(-x*x); }
vec3 flatDir(vec3 v){ vec3 h=vec3(v.x,0.,v.z); return dot(h,h)>1e-8 ? normalize(h) : vec3(0.,0.,-1.); }   // safe even looking straight down
float roadX(float z){ return 26.*sin(z*.016)+7.*sin(z*.037+1.)+14.*sin(z*.0061+2.); }
float roadDX(float z){ return .416*cos(z*.016)+.259*cos(z*.037+1.)+.0854*cos(z*.0061+2.); }

float hi(ivec2 c){ uvec2 q=uvec2(c); uint h=(q.x*1597334677u)^(q.y*3812015801u);
  h^=h>>16u; h*=2246822519u; h^=h>>13u; h*=3266489917u; h^=h>>16u; return float(h)*2.3283064e-10; }
float n2(vec2 p){ vec2 fl=floor(p), f=p-fl; ivec2 i=ivec2(fl); f=f*f*(3.-2.*f);
  return mix(mix(hi(i),hi(i+ivec2(1,0)),f.x), mix(hi(i+ivec2(0,1)),hi(i+ivec2(1,1)),f.x), f.y); }
float fbm2(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n2(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float h13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x), mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x), mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x), f.y), f.z); }
float fbm3(vec3 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }

// ---- terrain + overwash (twin of the JS versions) ----
float washZ(float zc){ return smoothstep(.45,.7,n2(vec2(zc*.011,7.5))); }
float floodZ(float zc){ return smoothstep(.6,.78,n2(vec2(zc*.0045,21.5))); }
float sandH(float u, float x, float z, float zc){
  float a=abs(u), ws=washZ(zc), fl=floodZ(zc);

  float bump=(n2(vec2(x*.17,z*.17))-.5)*.18+(n2(vec2(x*.7+9.,z*.7))-.5)*.08+(n2(vec2(x*2.4,z*2.4+5.))-.5)*.03;
  float w=abs(u+.12*sin(zc*.07)+.06*sin(zc*.23));
  float rut= a<2.4 ? -.05*gs((w-.6)/.11)-.04*gs((w-1.45)/.13)+.014*(gs((w-.38)/.07)+gs((w-.82)/.07)+gs((w-1.2)/.08)+gs((w-1.72)/.08)) : 0.;
  return ROAD_Y+base+bump*(1.-.6*smoothstep(5.,7.,a))+rut*(1.-ws)-(.16*ws+.1*fl)*(1.-clamp((a-3.6)/2.4,0.,1.));
}
float surge(float zc){ float ph=fract(uTime*.085+n2(vec2(zc*.015,3.))*1.6); return ph<.18 ? smoothstep(0.,.18,ph) : 1.-smoothstep(.18,1.,ph); }
float entrySide(float zc){ return clamp(sin(zc*.0037+.5)*4.,-1.,1.); }
float waterTable(float zc){ return ROAD_Y-.11+.03*n2(vec2(zc*.03,4.))-.16*washZ(zc)-.1*floodZ(zc); }
float waterLevel(float u, float zc, out float sg){
  float ws=washZ(zc), fl=floodZ(zc), e=u*entrySide(zc); sg=surge(zc);
  float surgeLvl=ROAD_Y-.45+ws*(.05+.33*sg-.009*(e+3.6));
  float floodLvl=ROAD_Y-.45+fl*(.43+.07*sg-.006*e);
  return max(max(surgeLvl,floodLvl), waterTable(zc));
}

// ---- sky ----
float moonGlow(){ return .35+.65*(.5+.5*cos(uPhase)); }
vec3 haze(vec3 d){
  float y=max(d.y,0.);
  vec3 c=mix(uSkyHor, uSkyTop, pow(y,.45));
  c+=uHorGlow*(exp(-y*9.)*.8+exp(-y*45.)*.7);
  float md=max(dot(d,uMoonDir),0.);
  c+=uMoonCol*(pow(md,6.)*.04+pow(md,240.)*.2)*moonGlow()*(1.-uDawn*.6);
  float sd=max(dot(d,uSunDir),0.);                                   // sunrise glow
  c+=vec3(1.,.56,.32)*(pow(sd,8.)*.09+pow(sd,90.)*.5)*uSun;
  c+=vec3(1.,.5,.3)*exp(-y*6.)*pow(max(dot(flatDir(d),flatDir(uSunDir)),0.),2.)*uDawn*.15;

}
vec3 starLayer(vec3 d, float sc, float seed){
  vec3 p=d*sc, id=floor(p), f=p-id;

  float b=h13(id+seed+37.), r=.0007*sc, bb=pow(b,30.), rr=r*(1.+bb);

vec3 milky(vec3 d, out float band){

  float cl=fbm3(d*4.5+3.);

  float m=band*(.25+1.1*core)*(.35+cl*1.2)*(1.-.8*dust)*(1.-.65*gs((x+.012)/.028)*(.4+cl));

vec3 aurora(vec3 d){
  if(d.y<.01 || d.y>.995) return vec3(0);

  for(int i=0;i<3;i++){
    float fi=float(i);
    float e=.13+.05*fi+.05*sin(az*2.3+fi*1.7+uTime*.05)+.04*fbm2(vec2(az*3.+fi*5.,uTime*.03));

vec3 moonDisc(vec3 d, out float disc){
  float a=acos(clamp(dot(d,uMoonDir),-1.,1.));

  if(disc<=0.) return vec3(0);

vec3 sky(vec3 d, float withStars){

    col+=s*smoothstep(0.,.14,d.y)*(1.-.85*pow(max(dot(d,uMoonDir),0.),40.))*(1.-uDawn);

// headlight: x = diffuse, y = specular
vec2 headLight(vec3 P, vec3 N, vec3 V, float gloss){
  vec3 L=uHeadPos-P; float d=length(L); L/=d;

}
`;
const WAVES = /* glsl */`
float waveH(vec2 p, int oct){
  float h=0., a=.2, f=.16, ang=.4;
  for(int i=0;i<22;i++){
    if(i>=oct) break;
    vec2 dir=vec2(sin(ang),cos(ang));
    h+=a*exp(sin(dot(dir,p)*f+uTime*sqrt(9.81*f))-1.);
    a*=.77; f*=1.23; ang+=2.39;
  }
  return h;
}
vec3 waveHG(vec2 p, int oct, float e){                                 // height + slope in one pass (was three passes of waveH)
  vec3 h=vec3(0.); float a=.2, f=.16, ang=.4;
  for(int i=0;i<22;i++){
    if(i>=oct) break;
    vec2 dir=vec2(sin(ang),cos(ang)), u=f*dir*e;
    float x=dot(dir,p)*f+uTime*sqrt(9.81*f), w=a*exp(sin(x)-1.);
    h+=vec3(w, w*cos(x)*f*dir*clamp(1.-u*u/40.,0.,1.));             // slope fades where the old step of e would have averaged it out

  }

}
float shoreAmp(float D){ return mix(.35,1.,smoothstep(6.5,20.,D)); }
`;

const skyMat = new THREE.ShaderMaterial({ uniforms:U, side:THREE.BackSide, depthWrite:false,

// ================= ocean =================
const gridGeo = (pos, idx) => new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)).setIndex(idx);
function radialGrid(rings = 260, segs = 360, r0 = .5, r1 = 4000){
  const pos = [], idx = [];
  for (let i = 0; i <= rings; i++){
    const r = r0*Math.pow(r1/r0, i/rings);
    for (let j = 0; j < segs; j++){ const a = j/segs*Math.PI*2; pos.push(Math.cos(a)*r, 0, Math.sin(a)*r); }
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < segs; j++){
    const a = i*segs + j, b = i*segs + (j+1)%segs;
    idx.push(a, b, a + segs, b, b + segs, a + segs);
  }
  return gridGeo(pos, idx);
}
const ocean = new THREE.Mesh(radialGrid(), new THREE.ShaderMaterial({ uniforms:U,
  vertexShader: COMMON + WAVES + `
  varying vec3 vW; varying float vD;
  void main(){
    vec4 w=modelMatrix*vec4(position,1.);

    vD=abs(w.x-roadX(w.z))*inversesqrt(1.+dx*dx);
    w.y+=(waveH(w.xz,7)-.34)*shoreAmp(vD);
    vW=w.xyz;
    gl_Position=projectionMatrix*viewMatrix*w;
  }`,
  fragmentShader: COMMON + WAVES + `
  varying vec3 vW; varying float vD;
  void main(){
    vec3 V=cameraPosition-vW; float dist=length(V); V/=dist;
    vec2 p=vW.xz;
    float e=.03+dist*.004, amp=shoreAmp(vD);
    int oc=uLite>.5 ? int(mix(20.,7.,smoothstep(40.,700.,dist))) : 20;   // below High: fine ripples only up close
    vec3 hg=waveHG(p,oc,e); float h0=hg.x;

    n=normalize(mix(n, vec3(0,1,0), smoothstep(300.,2500.,dist)*.6));
    vec3 R=reflect(-V,n); R.y=abs(R.y);

    vec3 body=uWater*(.5+.8*max(dot(n,uMoonDir),0.))+uWater*smoothstep(.55,.95,h0)*1.5;
    vec3 col=mix(body, sky(R,0.), fr);

    float shore=vD-5.9;
    float nz=fbm2(p*.3+vec2(uTime*.03,0.));
    float ph=fract(shore/7.5+uTime*.14+nz*.55);
    float crest=smoothstep(0.,.02,ph)*exp(-ph*11.)*exp(-max(shore,0.)/9.);
    float lace=smoothstep(.38,.7,fbm2(p*1.3+vec2(0.,uTime*.25)));
    float swash=gs(shore*.55)*(.4+.6*n2(p*2.5+uTime*.6));
    float foam=clamp(crest*(.35+lace)+swash*(.5+lace)+smoothstep(.85,1.1,h0)*lace*.5, 0., 1.);

    float hz2=1.-exp(-dist*.0009);

    col+=uMoonCol*pow(max(dot(R,uMoonDir),0.),900.)*7.*moonGlow()*(1.-hz2*.5);
    gl_FragColor=vec4(col,1.);
  }`,
}));

scene.add(ocean);

// ================= sand spit: a camera-following grid on a fixed world lattice (no swimming) =================
function landGrid(){
  const us = [], dzs = [];
  for (let u = -12; u < -3; u += .5) us.push(u);
  for (let u = -3; u < 3; u += .15) us.push(u);
  for (let u = 3; u <= 12.001; u += .5) us.push(u);
  for (let d = 60; d > 12; d -= 2) dzs.push(d);           // behind, for the mirrors
  for (let d = 12; d > -64; d -= .25) dzs.push(d);       // dense under the wheels
  for (let d = -64; d > -300; d -= 1) dzs.push(d);
  for (let d = -300; d >= -1600; d -= 4) dzs.push(d);    // sparse to the horizon
  const pos = [], idx = [], nC = us.length;
  for (const d of dzs) for (const u of us) pos.push(u, 0, d);
  for (let r = 0; r < dzs.length - 1; r++) for (let c = 0; c < nC - 1; c++){
    const a = r*nC + c; idx.push(a, a+1, a+nC, a+1, a+nC+1, a+nC);
  }
  return gridGeo(pos, idx);
}

function rockify(geo, amp, f, radial){
  const pos = geo.attributes.position, nor = geo.attributes.normal, v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    radial ? n.copy(v).normalize() : n.fromBufferAttribute(nor, i);
    const d = (n2(v.x*f + v.z*f*.7, v.y*f + 3.1)*.7 + n2(v.x*f*3.1, v.z*f*3.1 + v.y*f)*.3 - .5)*2*amp;
    pos.setXYZ(i, v.x + n.x*d, v.y + n.y*d, v.z + n.z*d);
  }
  geo.computeVertexNormals();
  return geo;
}

    const type = Math.floor(hi(s, 77)*4) % 4;
    if (used[type] >= 2) continue;
    const o = lmPools[type][used[type]++], z = -(s*LM_GAP + 220 + hi(s, 91)*260), side = hi(s, 13) < .5 ? -1 : 1;
    const dist = [80 + hi(s, 5)*40, 26 + hi(s, 6)*16, 0, 45 + hi(s, 7)*35][type];

    o.visible = true;
    if (type === 0){                                               // lighthouse beam turns; it flares when it sweeps past you
      const { beam, flare } = o.userData;

      const to = camera.position.clone().sub(o.position).setY(0).normalize(), bd = new THREE.Vector3(Math.cos(gameT*.7 + o.rotation.y), 0, -Math.sin(gameT*.7 + o.rotation.y));

const QUAD = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;

  vertexShader:QUAD,
  fragmentShader:`uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); bool bad=any(isnan(c))||any(isinf(c)); gl_FragColor=bad ? vec4(0.,0.,0.,1.) : min(c,vec4(64.)); }` }));
const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), .7, .55, .85);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const lens = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uRes:{value:new THREE.Vector2(W(), H())}, uTime:{value:0}, uWet:{value:.15}, uSeed:{value:0}, uAge:{value:0}, uSpeed:{value:0}, uTaps:{value:6} },
  vertexShader:QUAD,
  fragmentShader:`
  uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uWet, uSeed, uAge, uSpeed; uniform int uTaps; varying vec2 vUv;
  float h1(float n){ return fract(sin(n*91.3458)*47453.5453); }

      vec2 c=vec2(h1(fi+.31+uSeed), h1(fi*1.7+5.1+uSeed));

  const filt = (type, f, Q = 1) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };
  const gain = v => { const g = ac.createGain(); g.gain.value = v; return g; };

  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (R()*2 - 1)*Math.pow(1 - i/len, 3.2); }

    fetch(`sounds/${name}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(a => ac.decodeAudioData(a)).then(b => {
      buf[name] = b;
      if (!LOOPS.includes(name)) return;
      const s = ac.createBufferSource(), g = gain(0); s.buffer = b; s.loop = true; chain(s, g, name.startsWith('lofi') ? music : sfx); s.start(); loops[name] = { s, g };

const keys = {};

const START_Z = +(q.get('z') ?? 0);
const bike = (() => { const [x, z] = roadPt(START_Z, 1); return { x, z, yaw:Math.atan(roadDX(START_Z)), v:12, steer:0, gy:sandH(1, x, z, START_Z), pitch:0, lean:0 }; })();

function step(dt){
  const b = bike, f = roadFrame(b.x, b.z), au = Math.abs(f.u);
  const yawRoad = Math.atan(roadDX(f.zc - 6));
  let steerIn, thr;
  if (!playing){                                      // attract mode behind the menu: it rides itself
    steerIn = clamp((yawRoad + clamp((f.u - .9)*.15, -.4, .4) - b.yaw)*3, -1, 1);
    thr = clamp((13 - b.v)*.3, -1, 1);
  } else {
    const pad = padState();
    steerIn = clamp((keys.ArrowLeft || keys.KeyA ? 1 : 0) - (keys.ArrowRight || keys.KeyD ? 1 : 0) + pad.steer + (tiltOn ? clamp(-tilt/22, -1, 1) : 0), -1, 1);
    thr = clamp((keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0) + pad.thr, -1, 1);
  }
  b.v += (thr > 0 ? thr*(2.5 + 8*(1 - b.v/VMAX)) : thr*14)*dt;

  const ground = sandH(f.u, b.x, b.z, f.zc);
  const depth = Math.max(waterLevel(f.u, f.zc, gameT) - ground, au > 5.9 ? -ground : 0, 0);
  if (au > 2.8) b.v -= Math.max(0, b.v - 11)*1.2*dt;                    // loose sand
  b.v -= Math.max(0, b.v - 9)*sstep(.03, .25, depth)*1.4*dt;          // shallow water barely slows you, deep water does
  b.v = clamp(b.v, 0, VMAX);
  if (playing) tripM += b.v*dt;

  b.steer += (steerIn - b.steer)*Math.min(1, dt*5);
  const off = sstep(2.6, 7, au);                                          // off the path: guided home, never a crash
  const home = yawRoad + Math.sign(f.u)*.45*off;
  const assist = (Math.abs(steerIn) < .05 ? .35 : 0) + off*1.8;
  const yaw0 = b.yaw;
  b.yaw += b.steer*clamp(b.v/8, .3, 1)/(1 + b.v/40)*dt + (home - b.yaw)*Math.min(1, assist*dt);
  const yawRate = (b.yaw - yaw0)/dt;

  const fx = -Math.sin(b.yaw), fz = -Math.cos(b.yaw);

  const hAvg = (hAt(b.x, b.z) + hAt(b.x + fx*1.5, b.z + fz*1.5) + hAt(b.x - fx*1.5, b.z - fz*1.5) + hAt(b.x - fz*.8, b.z + fx*.8) + hAt(b.x + fz*.8, b.z - fx*.8))/5;

  if (inten > 0){
    const fr = roadFrame(b.x + fx*1.2, b.z + fz*1.2);

  wasInWater = inten;
  wet = Math.max(.15, wet - dt*.1); wetAge += dt;
  return { v:b.v, splash:inten, zc:f2.zc, thr };
}

let photo = false;
const look = { yaw:0, pitch:0, fov:62 };
const QUALITY = { low:{ pr:.75, bloom:false, env:24, rear:6, msaa:0, taps:3, lite:1 }, med:{ pr:1, bloom:true, env:12, rear:4, msaa:2, taps:4, lite:1 }, high:{ pr:1.5, bloom:true, env:6, rear:2, msaa:4, taps:6, lite:0 } };
let quality = 'high';
function applyQuality(name){
  quality = QUALITY[name] ? name : 'high';
  const qq = QUALITY[quality];
  renderer.setPixelRatio(STILL ? 1 : Math.min(devicePixelRatio, qq.pr)); composer.setPixelRatio(renderer.getPixelRatio());
  bloom.enabled = qq.bloom; U.uLite.value = MOBILE ? 1 : qq.lite; lens.uniforms.uTaps.value = MOBILE ? Math.min(qq.taps, 4) : qq.taps;   // phones: no galaxy in reflections, fewer lens taps
  for (const rt of [composer.renderTarget1, composer.renderTarget2]){ rt.samples = MOBILE ? Math.min(qq.msaa, 2) : qq.msaa; rt.dispose(); }
  resize();
  document.querySelectorAll('[data-q]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === quality)));
  store('quality', quality);
}

function frame(now){
  const dt = photo ? 0 : clamp((now - (frame.last ?? now))/1000, 0, 1/20); frame.last = now;
  gameT += dt;
  const st = photo ? { v:bike.v, splash:0, zc:roadFrame(bike.x, bike.z).zc, thr:0 } : step(Math.max(dt, 1e-4));
  updateWorld(dt);
  updateSplash(dt);

  const b = bike, fx = -Math.sin(b.yaw), fz = -Math.cos(b.yaw);
  const cockpit = !photo;
  bikeG.visible = cockpit;
  camera.position.set(b.x, b.gy + 1.2, b.z);
  const fit = v => Math.min(90, Math.max(v, Math.atan(Math.tan(v*Math.PI/360)*1.15/camera.aspect)*360/Math.PI));   // tall screens: keep at least a 1.15:1 screen's side view, up to 90° tall
  if (photo){ camera.rotation.set(look.pitch, look.yaw, 0); camera.fov = fit(look.fov); }   // photo: look around freely from the saddle
  else { camera.rotation.set(b.pitch - .05, b.yaw, b.lean); camera.fov = fit(62 + b.v/VMAX*14); }
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  bars.rotation.y = b.steer*.12;

  U.uTime.value = gameT; U.uCamZ.value = st.zc; U.uCam.value.copy(camera.position);
  U.uOriginZ.value = Math.ceil(b.z/4)*4;
  U.uPx.value = H()*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  U.uHeadPos.value.set(b.x + fx*1.05, b.gy + .78, b.z + fz*1.05);                  // headlight lives on the bike, whatever the camera
  U.uHeadDir.value.set(fx, -.06, fz).normalize();
  skyMesh.position.copy(camera.position);
  ocean.position.set(camera.position.x, 0, camera.position.z);

  // a shooting star every so often
  if (moment.kind === 'meteors' && moment.t < .1) nextShoot = gameT;
  if (shootT < 0 && gameT > nextShoot){
    const yaw = b.yaw + (R() - .5)*1.6, el = .3 + R()*.4;
    U.uShootA.value.copy(dirAt(yaw, el)); U.uShootB.value.copy(dirAt(yaw + (R() < .5 ? -.3 : .3), el - .14));
    shootT = 0; audio?.play('star', .3, .9 + R()*.25, true);
  }
  if (shootT >= 0){ shootT += dt/.9; U.uShootP.value = shootT; if (shootT > 1){ shootT = -1; U.uShootP.value = -1; nextShoot = gameT + (moment.kind === 'meteors' ? .3 + R()*.9 : 5 + R()*9); } }

  lens.uniforms.uTime.value = gameT; lens.uniforms.uWet.value = cockpit ? wet : 0; lens.uniforms.uAge.value = wetAge; lens.uniforms.uSpeed.value = photo ? 0 : b.v/VMAX;
  const kmh = Math.round(b.v*3.6);
  if (cockpit && (kmh !== dashKmh || now - dashAt > 1000) && now - dashAt > 200){ drawDash(kmh); dashKmh = kmh; dashAt = now; }
  updateAudio(st);
  if (cockpit){                                                      // refresh reflections and mirrors without the bike in them
    const q2 = QUALITY[quality], face = frameNo % (q2.env*(MOBILE ? 2 : 1));
    bikeG.visible = false;
    if (frameNo % (q2.rear + (MOBILE ? 1 : 0)) === 0){ renderer.setRenderTarget(rearRT); renderer.render(scene, rearCam); }
    if (face < 6){                                                   // one cube face per frame: no spike
      if (!face){ envCam.position.copy(camera.position); envCam.updateMatrixWorld(); }
      renderer.setRenderTarget(bikeEnvRT, face); renderer.render(scene, envCam.children[face]);
      if (face === 5) pmrem.fromCubemap(bikeEnvRT.texture, bikeEnvPM);
    }
    renderer.setRenderTarget(null); bikeG.visible = true;
  }
  frameNo++;
  composer.render();
}

// ================= menu + input =================
const menu = document.getElementById('menu'), hint = document.getElementById('hint'), rideBtn = document.getElementById('ride');
const photoBar = document.getElementById('photoBar');
let hintTimer, tiltOn = false, tilt = 0, padPrev = [];
const touchPad = document.getElementById('pad'), steerGrp = touchPad.querySelector('.steer'), pauseBtn = document.getElementById('pause'), shotBtn = document.getElementById('shot');
const held = new Map();                                              // pointer -> the key it holds, so a thumb can slide between buttons
const syncPad = () => touchPad.querySelectorAll('[data-key]').forEach(b => { const on = [...held.values()].includes(b.dataset.key); keys[b.dataset.key] = on; b.classList.toggle('on', on); });
const hold = e => { const b = document.elementFromPoint(e.clientX, e.clientY)?.closest('#pad [data-key]'); b ? held.set(e.pointerId, b.dataset.key) : held.delete(e.pointerId); syncPad(); };
for (const grp of touchPad.children){
  grp.addEventListener('pointerdown', e => { e.preventDefault(); hold(e); });
  grp.addEventListener('pointermove', e => { if (e.buttons) hold(e); });
  for (const ev of ['pointerup', 'pointercancel']) grp.addEventListener(ev, e => { held.delete(e.pointerId); syncPad(); });
}
touchPad.addEventListener('contextmenu', e => e.preventDefault());
function hud(){
  touchPad.hidden = !(MOBILE && playing && !photo); steerGrp.hidden = tiltOn;
  pauseBtn.hidden = shotBtn.hidden = !MOBILE || !playing || photo;
  if (touchPad.hidden){ held.clear(); syncPad(); }
}
function setPlaying(on){
  playing = on;
  if (!on) setPhoto(false);
  menu.classList.toggle('hidden', on);
  menu.inert = on;
  clearTimeout(hintTimer);
  hint.classList.toggle('gone', !on);
  if (on) hintTimer = setTimeout(() => hint.classList.add('gone'), 7000);
  hud();
}
function setPhoto(on){
  photo = on && playing;
  photoBar.hidden = !photo; document.body.classList.toggle('photo', photo);
  if (photo){ look.yaw = bike.yaw; look.pitch = -.05; look.fov = 62; }
  hud();
}
function savePhoto(){
  frame(performance.now());
  renderer.domElement.toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tidelight-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}
function padState(){
  const pad = [...(navigator.getGamepads?.() || [])].find(Boolean);
  if (!pad) return { steer:0, thr:0 };
  const pressed = i => !!pad.buttons[i]?.pressed, edge = i => pressed(i) && !padPrev[i];
  if (edge(9)) setPlaying(!playing);                                                       // Start: menu
  padPrev = pad.buttons.map(bt => bt.pressed);
  const ax = pad.axes[0] || 0;
  return { steer:Math.abs(ax) > .12 ? -ax : 0, thr:(pad.buttons[7]?.value || 0) - (pad.buttons[6]?.value || 0) };
}
rideBtn.addEventListener('click', () => setPlaying(true));
document.querySelectorAll('[data-mood]').forEach(btn => btn.addEventListener('click', () => applyMood(btn.dataset.mood)));
document.querySelectorAll('[data-paint]').forEach(btn => btn.addEventListener('click', () => applyPaint(btn.dataset.paint)));
document.querySelectorAll('[data-q]').forEach(btn => btn.addEventListener('click', () => applyQuality(btn.dataset.q)));
document.getElementById('photoSave').addEventListener('click', savePhoto);
document.getElementById('photoExit').addEventListener('click', () => setPhoto(false));
pauseBtn.addEventListener('click', () => setPlaying(false));
shotBtn.addEventListener('click', () => setPhoto(true));
document.querySelectorAll('[data-vol]').forEach(el => el.addEventListener('input', () => {
  vol[el.dataset.vol] = +el.value; store(el.dataset.vol, el.value);
  if (!soundOn) setSound(true);                                      // reaching for a slider means they want to hear it
  applyVol();
}));
if (MOBILE){ hint.textContent = 'Steer on the left · set your speed on the right'; photoBar.firstElementChild.textContent = 'Drag to look around'; }
addEventListener('keydown', e => {
  if (e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Escape'){ if (photo) setPhoto(false); else { setPlaying(!playing); if (!playing) rideBtn.focus(); } }
  else if (e.code === 'Enter' && photo) savePhoto();
  else if (e.code === 'Enter' && !playing && !document.activeElement?.closest('button')) setPlaying(true);
  else if (e.code === 'KeyM') setSound(!soundOn);
  else if (e.code === 'KeyP' && playing) setPhoto(!photo);
  else if (['Digit1','Digit2','Digit3'].includes(e.code)) applyMood(['moon','dream','glow'][+e.code.slice(-1) - 1]);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// photo mode: drag looks around, the wheel zooms
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (photo){ drag = { x:e.clientX, y:e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!photo || !drag) return;
  look.yaw += (e.clientX - drag.x)*.004; look.pitch = clamp(look.pitch + (e.clientY - drag.y)*.004, -1.2, 1.2);
  drag = { x:e.clientX, y:e.clientY };
});
addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('wheel', e => { if (photo){ e.preventDefault(); look.fov = clamp(look.fov*Math.exp(e.deltaY*.001), 20, 90); } }, { passive:false });
const tiltBtn = document.getElementById('tilt');
document.getElementById('tiltRow').hidden = !MOBILE;
tiltBtn.addEventListener('click', async () => {
  if (!tiltOn && typeof DeviceOrientationEvent?.requestPermission === 'function'){ try { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return; } catch { return; } }
  tiltOn = !tiltOn; tiltBtn.setAttribute('aria-pressed', String(tiltOn)); hud();
});
addEventListener('deviceorientation', e => { tilt = e.gamma || 0; });

applyMood(moodName);
applyPaint(store('paint') || 'rosso');
applyQuality(store('quality') || (MOBILE ? 'med' : 'high'));
setSound(false); applyVol();
setPlaying(STILL);
if (STILL){ menu.style.display = 'none'; soundBtn.style.display = 'none'; }
const fpsEl = q.has('fps') ? document.body.appendChild(Object.assign(document.createElement('div'), { style:'position:fixed;left:50%;translate:-50% 0;top:8px;font:12px monospace;color:#9f9;z-index:9' })) : null;
let perf = { n:0, ms:0, cpu:0 };
renderer.setAnimationLoop(now => {
  const gap = now - (frame.last ?? now);
  if (MOBILE && gap > 0 && gap < 10) return;                       // 120 Hz phones: every other frame (60 fps); 60/90 Hz run as is
  if (gap > 0 && gap < 100 && !STILL && (perf.ms += gap, ++perf.n === 60)){   // dynamic resolution, kept within 75-100% of the chosen setting so it never turns to mush
    const ms = perf.ms/60, cur = renderer.getPixelRatio(), max = Math.min(devicePixelRatio, QUALITY[quality].pr), next = clamp(ms > 19 ? cur*.9 : ms < 17.5 ? cur*1.1 : cur, max*.75, max);
    if (MOBILE && Math.abs(next - cur) > .02){ renderer.setPixelRatio(next); composer.setPixelRatio(next); resize(); }   // phones only: desktops can run slow frames for reasons pixels can't fix (power saving, 50 Hz screens)
    if (fpsEl) fpsEl.textContent = `${Math.round(1000/ms)} fps · cpu ${(perf.cpu/60).toFixed(1)} ms · ${renderer.getPixelRatio().toFixed(2)}x · ${quality}`;
    perf = { n:0, ms:0, cpu:0 };
  }
  const t0 = performance.now(); frame(now); perf.cpu += performance.now() - t0;
});
window.snap = (n = 1) => { const t0 = performance.now(); for (let i = 1; i <= n; i++) frame(t0 + i*1000/60); return new Promise(r => renderer.domElement.toBlob(r, 'image/png')); };   // capture hook
</script>
</body>
</html>
